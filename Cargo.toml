[package]
name = "minigraf-wasm"
version = "1.1.1"
edition = "2024"
publish = false
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/project-minigraf/minigraf-wasm"
description = "wasm-pack build shim for Minigraf browser and WASI targets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Unreleased v3 core (format v8). Switches to version = "=3.0.0" at the v3.0.0 release.
minigraf = { git = "https://github.com/project-minigraf/minigraf", rev = "b8d3a9b05328c33a5213976902db3d82d257ad38", features = ["browser"] }

[features]
browser = ["minigraf/browser"]

[workspace]
members = ["."]
